name: MLB hitter cohort retrospective diagnostics tests
on:
  push:
    branches: [feature/mlb-hitter-prop-cohort-review-v1]
    paths:
      - sports_mlb_prop_cohort.py
      - sports_mlb_prop_cohort_diagnostics.py
      - test_sports_mlb_prop_cohort.py
      - test_sports_mlb_prop_cohort_diagnostics.py
      - .github/workflows/mlb_prop_cohort_checks.yml
  pull_request:
    branches: [main]
    paths:
      - sports_mlb_prop_cohort.py
      - sports_mlb_prop_cohort_diagnostics.py
      - test_sports_mlb_prop_cohort.py
      - test_sports_mlb_prop_cohort_diagnostics.py
      - .github/workflows/mlb_prop_cohort_checks.yml
permissions:
  contents: read
jobs:
  cohort-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_sports_mlb_prop_cohort test_sports_mlb_prop_cohort_diagnostics
