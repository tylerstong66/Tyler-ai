name: Reliability checks
on:
  push:
    branches: [main, codex/reliability-v2-9]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compile application and helpers
        run: python -m py_compile app.py reliability.py test_reliability.py
      - name: Offline regression suite
        run: python -m unittest -v test_reliability
