name: NBA public endpoint access diagnostic
on:
  pull_request:
    paths:
      - sports_nba_final_games_page.py
      - sports_nba_final_games_page_v2.py
      - test_sports_nba_final_games_page_v2.py
      - sports_nba_games_page.py
      - sports_nba_games_page_v2.py
      - test_sports_nba_games_page_v2.py
      - sports_nba_source_access_probe.py
      - test_sports_nba_source_access_probe.py
      - sports_nba_historical_owned.py
      - sports_nba_official_schedule_audit.py
      - .github/workflows/nba_source_access_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest -v test_sports_nba_source_access_probe test_sports_nba_games_page test_sports_nba_games_page_v2 test_sports_nba_final_games_page test_sports_nba_final_games_page_v2
      - name: Observe fixed public NBA endpoint access without enabling a source
        run: python sports_nba_source_access_probe.py --probe --output-dir nba-source-access-probe
      - name: Inspect date-envelope fields of exact opaque daily responses without enabling sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from sports_expansion_audit import bounded_gzip_read
          import sports_nba_games_page as page
          root = Path('nba-source-access-probe')
          report = json.loads((root/'report.json').read_text())
          assert report['NO_BET'] and not report['source_payload_validated']
          rows = []
          for receipt in report['requests']:
              if 'games_page' not in receipt['endpoint'] and receipt['endpoint'] != 'official_reference_final_page':
                  continue
              item = {'endpoint': receipt['endpoint'], 'requested_url': receipt['url'],
                      'payload_archived': receipt['payload_archived'],
                      'source_payload_validated': False, 'forecasting_enabled': False}
              if receipt['payload_archived']:
                  raw = bounded_gzip_read((root/receipt['archive_file']).read_bytes(), page.MAX_BYTES)
                  assert len(raw) == receipt['response_body_bytes']
                  assert hashlib.sha256(raw).hexdigest() == receipt['response_body_sha256']
                  item['original_body_sha256'] = receipt['response_body_sha256']
                  try:
                      parser = page._NextData()
                      parser.feed(raw.decode('utf-8')); parser.close()
                      if parser.matches != 1 or not parser.closed or parser.active:
                          raise ValueError('Unsupported data envelope')
                      data = json.loads(''.join(parser.parts), object_pairs_hook=page._object,
                                        parse_constant=page._reject_constant)
                      props = data['props']['pageProps']
                      item.update(page=data.get('page'), query=data.get('query'),
                                  selectedDate=props.get('selectedDate'),
                                  isDateOverrideActive=props.get('isDateOverrideActive'),
                                  hasError=props.get('hasError'),
                                  isFallback=data.get('isFallback'),
                                  page_prop_keys=sorted(props))
                  except (ValueError, KeyError, TypeError, AttributeError, UnicodeError) as error:
                      item['envelope_error_type'] = type(error).__name__
              rows.append(item)
          print('NBA_OPAQUE_DATE_ENVELOPE_DIAGNOSTIC='+json.dumps(rows, sort_keys=True, allow_nan=False))
          (root/'date-envelope-diagnostic.json').write_text(json.dumps(rows, sort_keys=True, indent=2)+chr(10))
          PY
      - name: Evaluate native null-envelope candidate without writing source receipts
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import hashlib
          import json
          from urllib.parse import urlsplit, parse_qs
          from sports_expansion_audit import bounded_gzip_read
          import sports_nba_games_page_v2 as candidate
          root = Path('nba-source-access-probe')
          report = json.loads((root/'report.json').read_text())
          observed = datetime.fromisoformat(report['probe_started_at_utc'])
          rows = []
          for receipt in report['requests']:
              if receipt['endpoint'] not in ('official_games_page', 'official_next_games_page'):
                  continue
              row = {'endpoint': receipt['endpoint'], 'native_candidate_parse_succeeded': False,
                     'source_payload_validated': False, 'cross_source_identity_verified': False,
                     'forecasting_enabled': False, 'model_training_enabled': False,
                     'promotion_allowed': False, 'NO_BET': True, 'actual_wagers': 0}
              if receipt['payload_archived']:
                  raw = bounded_gzip_read((root/receipt['archive_file']).read_bytes(), 8_000_000)
                  assert len(raw) == receipt['response_body_bytes']
                  assert hashlib.sha256(raw).hexdigest() == receipt['response_body_sha256']
                  requested = parse_qs(urlsplit(receipt['url']).query)['date'][0]
                  year = int(requested[:4]) - (int(requested[5:7]) < 7)
                  season = str(year)+'-'+str((year+1) % 100).zfill(2)
                  try:
                      parsed = candidate.parse(raw, requested_date=requested, season=season,
                                               observed_at=observed)
                      row.update(native_candidate_parse_succeeded=True, parser_report=parsed)
                  except ValueError as error:
                      row['candidate_rejection'] = str(error)
              rows.append(row)
          print('NBA_NULL_ENVELOPE_CANDIDATE='+json.dumps(rows, sort_keys=True, allow_nan=False))
          (root/'null-envelope-candidate.json').write_text(json.dumps(rows, sort_keys=True, indent=2)+chr(10))
          PY
      - name: Cross-check candidate identities against audited retained ESPN bodies
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import sports_nba_owned_daily_observation as daily
          import sports_nba_official_schedule_audit as nba
          root = Path('nba-source-access-probe')
          candidates = json.loads((root/'null-envelope-candidate.json').read_text())
          captures = sorted((daily.espn.ROOT/'captures').glob('*/manifest.json'))
          output = {'schema': 'tyler-nba-null-envelope-retained-provider-diagnostic-v1',
                    'source_receipts_written': 0, 'forecasting_enabled': False,
                    'model_training_enabled': False, 'promotion_allowed': False,
                    'NO_BET': True, 'actual_wagers': 0, 'pages': []}
          if not captures:
              output['provider_status'] = 'NO_RETAINED_PROVIDER_CAPTURE'
          else:
              stamp = captures[-1].parent.name
              provider_raw, manifest, provider = daily._provider(Path('.'), stamp)
              provider_clock = daily.espn.utc(manifest['recorded_at_utc'])
              output.update(provider_capture=stamp,
                            provider_manifest_sha256=hashlib.sha256(provider_raw).hexdigest())
              for candidate in candidates:
                  if not candidate['native_candidate_parse_succeeded']:
                      continue
                  parsed = candidate['parser_report']
                  observed = daily.espn.utc(parsed['observed_at_utc'])
                  row = {'requested_date': parsed['requested_date'],
                         'native_body_sha256': parsed['original_body_sha256'],
                         'provider_is_prior_and_within_12_hours':
                             provider_clock <= observed and observed-provider_clock <= daily.MAX_AGE,
                         'forecasting_enabled': False, 'source_origin_independently_attested': False}
                  if row['provider_is_prior_and_within_12_hours']:
                      selected = {key: game for key, game in provider.items()
                                  if daily.espn.utc(game['scheduled_start_utc']).astimezone(daily.page.EASTERN).date().isoformat()
                                     == parsed['requested_date']}
                      report = nba.compare(parsed['games'], selected)
                      counts = {}
                      for match in report['matched']:
                          key = match['nba_official_game_id']
                          counts[key] = counts.get(key, 0)+1
                      accepted = []
                      withheld = list(report['unverified'])
                      for match in report['matched']:
                          game = selected[match['espn_game_id']]
                          if (counts[match['nba_official_game_id']] == 1
                                  and match['start_offset_minutes'] == 0
                                  and game['season_stage'] == 2
                                  and game['provider_completed'] is False and game['state'] == 'pre'
                                  and observed < daily.espn.utc(game['scheduled_start_utc'])):
                              accepted.append(match)
                          else:
                              withheld.append({**match, 'reason': 'NOT_EXACT_UNIQUE_FUTURE_PREGAME'})
                      covered = {match['nba_official_game_id'] for match in accepted}
                      uncovered = sorted(game['nba_game_id'] for game in parsed['games']
                                         if game['nba_game_id'] not in covered)
                      row.update(exact_unique_pregame_matches=accepted, withheld=withheld,
                                 official_ids_without_exact_provider_match=uncovered,
                                 native_game_count=len(parsed['games']), provider_game_count=len(selected),
                                 complete_date_identity_agreement=bool(parsed['games']) and not uncovered
                                     and not withheld and len(accepted) == len(selected))
                  output['pages'].append(row)
          print('NBA_NULL_ENVELOPE_PROVIDER_CHECK='+json.dumps(output, sort_keys=True, allow_nan=False))
          (root/'null-envelope-provider-check.json').write_text(json.dumps(output, sort_keys=True, indent=2)+chr(10))
          PY
      - name: Inspect native regulation-final reference without prospective claims
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import hashlib
          import json
          from sports_expansion_audit import bounded_gzip_read
          import sports_nba_final_games_page_v2 as final
          root = Path('nba-source-access-probe')
          report = json.loads((root/'report.json').read_text())
          rows = []
          for receipt in report['requests']:
              if receipt['endpoint'] != 'official_reference_final_page':
                  continue
              row = {'endpoint': receipt['endpoint'], 'native_final_parse_succeeded': False,
                     'historical_reference_only': True, 'prospective_outcomes_enrolled': 0,
                     'available_at_historical_pregame_freeze': False,
                     'official_final_results_verified': False, 'forecasting_enabled': False,
                     'model_training_enabled': False, 'settlement_enabled': False,
                     'promotion_allowed': False, 'NO_BET': True, 'actual_wagers': 0}
              if receipt['payload_archived']:
                  raw = bounded_gzip_read((root/receipt['archive_file']).read_bytes(), 8_000_000)
                  assert len(raw) == receipt['response_body_bytes']
                  assert hashlib.sha256(raw).hexdigest() == receipt['response_body_sha256']
                  try:
                      parsed = final.parse(raw, requested_date='2026-04-10', season='2025-26',
                                           observed_at=datetime.fromisoformat(report['probe_started_at_utc']))
                      row.update(native_final_parse_succeeded=True, parser_report=parsed)
                  except ValueError as error:
                      row['candidate_rejection'] = str(error)
              rows.append(row)
          print('NBA_NATIVE_NULL_FINAL_DIAGNOSTIC='+json.dumps(rows, sort_keys=True, allow_nan=False))
          (root/'native-null-final-diagnostic.json').write_text(json.dumps(rows, sort_keys=True, indent=2)+chr(10))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-public-endpoint-access-diagnostic
          path: nba-source-access-probe/
          if-no-files-found: error
          retention-days: 30
