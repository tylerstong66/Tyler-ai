name: MLB hitter shadow official final collection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb_hit_shadow_auto_settlement.yml'
      - 'sports_mlb_prop_prospective.py'
      - 'sports_mlb_prop_settlement_job.py'
      - 'sports_mlb_prop_scoreboard_publish.py'
      - 'test_sports_mlb_prop_scoreboard_publish.py'
      - 'sports_mlb_final_source_audit.py'
      - 'test_sports_mlb_final_source_audit.py'
      - 'test_sports_mlb_prop_prospective.py'
      - 'test_sports_mlb_prop_settlement_job.py'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mlb-hitter-shadow-official-final-collection
  cancel-in-progress: false
jobs:
  settle-after-final:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify settlement remains separate and non-wagering
        run: python -m unittest -v test_sports_mlb_prop_prospective test_sports_mlb_prop_settlement_job test_sports_mlb_prop_scoreboard_feed test_sports_mlb_prop_shadow_scoreboard test_sports_mlb_final_source_audit test_sports_mlb_prop_scoreboard_publish
      - name: Retain read-only pending final-source identity evidence before strict settlement
        run: python sports_mlb_final_source_audit.py --observe --output-dir mlb-final-source-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-pending-final-source-audit
          path: mlb-final-source-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Read public official MLB finals and create new settlement files only
        run: python sports_mlb_prop_settlement_job.py --root benchmarks/mlb_hitter_props_shadow_v1
      - name: Summarize frozen player-games, pending finals and model diagnostic
        run: python sports_mlb_prop_shadow_scoreboard.py
      - name: Commit only newly created official final settlement files
        shell: bash
        run: |
          if [ ! -d benchmarks/mlb_hitter_props_shadow_v1/settlements ]; then
            echo "No completed official finals to record."
            exit 0
          fi
          git add -A benchmarks/mlb_hitter_props_shadow_v1/settlements/
          if git diff --cached --quiet; then
            echo "No new final results."
            exit 0
          fi
          git diff --cached --name-only | grep -v '^benchmarks/mlb_hitter_props_shadow_v1/settlements/' && exit 1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Settle officially final MLB hitter conditional shadow trials [no bets]"
          git push origin HEAD:main
      - name: Refresh read-only scoreboard after final-settlement commit
        run: python sports_mlb_prop_scoreboard_publish.py
