name: Tyler AI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reliability, skill, and observability tests
        run: >-
          python -m unittest -v
          test_reliability.py
          test_skill_engine.py
          test_skill_tool_fallback.py
          test_grounded_evaluator.py
          test_evaluator_score_normalization.py
          test_auditable_evaluator.py
          test_contextual_architecture_checks.py
          test_adaptive_groq_fallback.py
          test_code_grounded_developer.py
          test_dependency_observability.py

      - name: Smoke-test v2.9 integration
        run: |
          python - <<'PY'
          import app_v2_9
          assert app_v2_9.VERSION_SHORT == 'v2.9.0'
          assert app_v2_9.app is not None
          assert 'skill_profile' in app_v2_9.base.SPECIAL_MEMORY_CATEGORIES
          print('v2.9 integration import passed')
          PY

      - name: Smoke-test v2.9.1 integration
        run: |
          python - <<'PY'
          import app_v2_9_1
          assert app_v2_9_1.VERSION_SHORT == 'v2.9.1'
          assert app_v2_9_1.app is not None
          assert app_v2_9_1.ENGINE.complete is app_v2_9_1._skill_complete
          print('v2.9.1 integration import passed')
          PY

      - name: Smoke-test v2.9.2 integration
        run: |
          python - <<'PY'
          import app_v2_9_2
          assert app_v2_9_2.VERSION_SHORT == 'v2.9.2'
          assert app_v2_9_2.app is not None
          assert app_v2_9_2.ENGINE.evaluate_skill is app_v2_9_2._grounded_evaluate_skill
          print('v2.9.2 integration import passed')
          PY

      - name: Smoke-test v2.9.3 integration
        run: |
          python - <<'PY'
          import app_v2_9_3
          assert app_v2_9_3.VERSION_SHORT == 'v2.9.3'
          assert app_v2_9_3.app is not None
          assert app_v2_9_3.ENGINE.evaluate_skill is app_v2_9_3._evaluate_skill_v293
          print('v2.9.3 integration import passed')
          PY

      - name: Smoke-test v2.9.4 integration
        run: |
          python - <<'PY'
          import app_v2_9_4
          assert app_v2_9_4.VERSION_SHORT == 'v2.9.4'
          assert app_v2_9_4.app is not None
          assert app_v2_9_4.ENGINE.evaluate_skill is app_v2_9_4._evaluate_skill_v294
          print('v2.9.4 integration import passed')
          PY

      - name: Smoke-test v2.9.5 integration
        run: |
          python - <<'PY'
          import app_v2_9_5
          assert app_v2_9_5.VERSION_SHORT == 'v2.9.5'
          assert app_v2_9_5.app is not None
          assert app_v2_9_5.v294.v293.v292._architecture_checks is app_v2_9_5._contextual_architecture_checks
          print('v2.9.5 integration import passed')
          PY

      - name: Smoke-test v2.9.6 integration
        run: |
          python - <<'PY'
          import app_v2_9_6
          assert app_v2_9_6.VERSION_SHORT == 'v2.9.6'
          assert app_v2_9_6.app is not None
          assert app_v2_9_6.v291._fallback_groq is app_v2_9_6._adaptive_fallback_groq
          print('v2.9.6 integration import passed')
          PY

      - name: Smoke-test v2.9.7 integration
        run: |
          python - <<'PY'
          import app_v2_9_7
          assert app_v2_9_7.VERSION_SHORT == 'v2.9.7'
          assert app_v2_9_7.app is not None
          assert app_v2_9_7.ENGINE.run_skill is app_v2_9_7._run_code_grounded_skill
          snapshot = app_v2_9_7._developer_grounding('review architecture', max_chars=5000)
          assert 'VERIFIED LOCAL SOURCE SNAPSHOT' in snapshot
          print('v2.9.7 integration import passed')
          PY

      - name: Smoke-test v2.10 integration
        run: |
          python - <<'PY'
          import app_v2_10
          assert app_v2_10.VERSION_SHORT == 'v2.10.0'
          assert app_v2_10.app is not None
          assert app_v2_10.base.groq is app_v2_10.groq_observed
          assert app_v2_10.base.send_email_via_n8n is app_v2_10.send_email_via_n8n_observed
          assert 'dependency_observability.py' in app_v2_10.v297._safe_source_files()
          with app_v2_10.app.test_client() as client:
              health = client.get('/health')
              assert health.status_code == 200
              assert health.get_json()['active_probes'] is False
          print('v2.10 integration import passed')
          PY
