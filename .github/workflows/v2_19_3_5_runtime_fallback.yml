name: v2.19.3.5 runtime fallback

on:
  push:
    branches: [main]
    paths:
      - "app_v2_19_3_5.py"
      - "app_v2_10.py"
      - "app_v2_10_2.py"
      - "dependency_observability.py"
      - "persistent_health_history.py"
      - "health_intelligence.py"
      - "test_v2_19_3_5_runtime_fallback.py"
      - "test_dependency_observability.py"
      - ".github/workflows/v2_19_3_5_runtime_fallback.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_v2_19_3_5_runtime_fallback.py
      - run: python -m unittest -v test_dependency_observability.py
      - run: python -m unittest -v test_persistent_health_history.py
      - run: python -m unittest -v test_health_intelligence.py
      - run: python -m unittest -v test_v2_19_3_3_gemini_training.py
      - run: python -m unittest -v test_v2_19_3_4_health_markdown.py

