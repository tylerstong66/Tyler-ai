name: Sports prospective paper tests
on:
  push:
    branches: ['main']
    paths: ['sports_prospective_test.py', 'sports_two_way_test.py', 'sports_benchmark_review.py', 'sports_market_evidence.py', 'sports_benchmark_coverage.py', 'sports_nhl_challenger_shadow.py', 'sports_nhl_shadow_checkpoint.py', 'sports_nhl_shadow_preview.py', 'sports_nhl_shadow_casebook.py', 'benchmarks/nhl_challenger_shadow_v1/protocol.json', '.github/workflows/nfl_prospective_paper.yml']
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nfl-prospective-paper-test
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Capture NFL data, freeze paper forecasts and verify finals
        env:
          GH_PUBLIC_READ_TOKEN: ${{ github.token }}
        run: python sports_prospective_test.py
      - name: Capture all eligible NHL and MLB games and verify finals
        if: always()
        run: python sports_two_way_test.py
      - name: Record only future NHL challenger shadow forecasts and score verified existing finals
        id: nhl_shadow
        if: always()
        run: python sports_nhl_challenger_shadow.py
      - name: Review saved NFL, NHL and MLB benchmark results
        if: always()
        run: python sports_benchmark_review.py
      - name: Audit saved forecast enrollment and market coverage
        if: always()
        run: python sports_benchmark_coverage.py
      - name: Preserve audit data even when upstream sources fail
        if: always()
        run: |
          git add benchmarks/nfl_prospective_v2 benchmarks/two_way_prospective
          # Do not publish a partially created shadow cohort if its validation
          # failed; retain independently collected original sports evidence.
          if [ "${{ steps.nhl_shadow.outcome }}" = "success" ]; then
            git add benchmarks/nhl_challenger_shadow_v1
          else
            echo '::warning::NHL shadow step did not succeed; exclude shadow artifacts from publication'
          fi
          if ! git diff --cached --quiet; then
            git config user.name github-actions\[bot\]
            git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
            git commit -m 'Record sports prospective paper-test evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
