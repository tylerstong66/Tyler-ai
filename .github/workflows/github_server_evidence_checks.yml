name: Shared immutable GitHub server evidence checks
on:
  pull_request:
    branches: [main]
    paths:
      - sports_github_server_evidence.py
      - test_sports_github_server_evidence.py
      - sports_nba_feature_publication.py
      - sports_mlb_cohort_publication.py
      - .github/workflows/github_server_evidence_checks.yml
  push:
    branches: [main]
    paths:
      - sports_github_server_evidence.py
      - test_sports_github_server_evidence.py
      - sports_nba_feature_publication.py
      - sports_mlb_cohort_publication.py
      - .github/workflows/github_server_evidence_checks.yml
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest -v test_sports_github_server_evidence test_sports_nba_feature_publication test_sports_mlb_cohort_publication
