name: Publish Tyler MLB shadow scoreboard snapshot
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb_shadow_scoreboard_publisher.yml'
      - 'sports_mlb_shadow_uncertainty.py'
      - 'sports_mlb_prop_shadow_scoreboard.py'
      - 'sports_mlb_prop_scoreboard_feed.py'
      - 'sports_mlb_prop_scoreboard_publish.py'
      - 'test_sports_mlb_prop_scoreboard_publish.py'
      - 'sports_mlb_prop_scoreboard_reader.py'
permissions:
  contents: write
concurrency:
  group: mlb-shadow-scoreboard-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test feed authenticity, aggregation and no-wager safeguards
        run: python -m unittest -v test_sports_mlb_prop_scoreboard_feed test_sports_mlb_prop_shadow_scoreboard test_sports_mlb_prop_scoreboard_publish
      - name: Publish the current committed ledger with bounded concurrent-update retries
        run: python sports_mlb_prop_scoreboard_publish.py
