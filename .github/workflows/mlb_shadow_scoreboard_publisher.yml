name: Publish Tyler MLB shadow scoreboard snapshot
on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mlb_shadow_scoreboard_publisher.yml'
      - 'sports_mlb_shadow_uncertainty.py'
      - 'sports_mlb_prop_shadow_scoreboard.py'
      - 'sports_mlb_prop_scoreboard_feed.py'
      - 'sports_mlb_prop_scoreboard_reader.py'
permissions:
  contents: write
concurrency:
  group: mlb-shadow-scoreboard-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test feed authenticity, aggregation and no-wager safeguards
        run: python -m unittest -v test_sports_mlb_prop_scoreboard_feed test_sports_mlb_prop_shadow_scoreboard
      - name: Publish changed benchmark or bounded unchanged-ledger heartbeat
        run: python sports_mlb_prop_scoreboard_feed.py
      - name: Commit the one permitted public benchmark snapshot
        shell: bash
        run: |
          git add -- benchmarks/mlb_hitter_props_shadow_v1/scoreboard.latest.json
          if git diff --cached --quiet; then
            echo "Published scoreboard heartbeat is still fresh; no write."
            exit 0
          fi
          python - <<'PY'
          import subprocess
          statuses=subprocess.check_output(
              ['git','diff','--cached','--name-status','-z']).split(b'\0')
          if statuses[-1:]==[b'']:
              statuses.pop()
          expected=b'benchmarks/mlb_hitter_props_shadow_v1/scoreboard.latest.json'
          assert statuses in ([b'A',expected],[b'M',expected]),statuses
          print('ONE_PUBLIC_SCOREBOARD_SNAPSHOT_ONLY')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh read-only MLB hitter research scoreboard [no bets]"
          git push origin HEAD:main
