name: MLB named lookup live source audit
on:
  push:
    branches: ['audit/mlb-named-live-20261015']
    paths:
      - audit_mlb_named_live.py
      - .github/workflows/mlb_named_live_audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python audit_mlb_named_live.py
