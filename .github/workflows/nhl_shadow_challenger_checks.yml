name: NHL challenger shadow checks
on:
  push:
    paths: ['sports_nhl_challenger_shadow.py', 'test_sports_nhl_challenger_shadow.py', 'benchmarks/nhl_challenger_shadow_v1/**', '.github/workflows/nhl_shadow_challenger_checks.yml', '.github/workflows/nfl_prospective_paper.yml']
  pull_request:
    paths: ['sports_nhl_challenger_shadow.py', 'test_sports_nhl_challenger_shadow.py', 'benchmarks/nhl_challenger_shadow_v1/**', '.github/workflows/nhl_shadow_challenger_checks.yml', '.github/workflows/nfl_prospective_paper.yml']
permissions:
  contents: read
jobs:
  future-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source hashes, forward-only enrollment and final scoring
        run: python -m unittest -v test_sports_nhl_challenger_shadow
      - name: Recheck pinned 2024/2025 development against original inputs
        run: python -m unittest -v test_sports_two_way_challenger
      - name: Offline dry-run of shadow cohort
        run: python sports_nhl_challenger_shadow.py
