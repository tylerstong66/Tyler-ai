name: MLB frozen hitter shadow scoreboard tests
on:
  push:
    branches: ['feature/mlb-shadow-scoreboard-v1']
    paths:
      - sports_mlb_prop_shadow_scoreboard.py
      - test_sports_mlb_prop_shadow_scoreboard.py
      - .github/workflows/mlb_shadow_scoreboard_tests.yml
  pull_request:
    branches: [main]
    paths:
      - sports_mlb_prop_shadow_scoreboard.py
      - test_sports_mlb_prop_shadow_scoreboard.py
      - .github/workflows/mlb_shadow_scoreboard_tests.yml
permissions:
  contents: read
jobs:
  run-report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_sports_mlb_prop_shadow_scoreboard test_sports_mlb_prop_settlement_job
