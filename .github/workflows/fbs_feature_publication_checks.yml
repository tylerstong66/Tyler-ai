name: FBS frozen feature publication chronology checks
on:
  pull_request:
    branches: [main]
    paths:
      - sports_fbs_feature_publication.py
      - test_sports_fbs_feature_publication.py
      - sports_fbs_pregame_features.py
      - sports_github_server_evidence.py
      - benchmarks/fbs_pregame_reference_features_v1/**
      - .github/workflows/fbs_feature_publication_checks.yml
  push:
    branches: [main]
    paths:
      - sports_fbs_feature_publication.py
      - test_sports_fbs_feature_publication.py
      - sports_fbs_pregame_features.py
      - sports_github_server_evidence.py
      - benchmarks/fbs_pregame_reference_features_v1/**
      - .github/workflows/fbs_feature_publication_checks.yml
permissions:
  contents: read
jobs:
  chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest -v test_sports_fbs_feature_publication test_sports_fbs_pregame_features test_sports_github_server_evidence
      - name: Verify retained files match the recipe without claiming fresh server proof
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          import sports_fbs_pregame_features as f
          status=f.inspect()
          reports=[json.loads((f.ROOT.parent/'publication_v1'/name).read_text())
                   for name in ('first_cohort.json', 'second_cohort.json')]
          evidence=[row for report in reports for row in report['evidence']]
          assert len({row['espn_game_id'] for row in evidence})==len(evidence)
          assert status['verified_existing'] >= len(evidence)
          for row in evidence:
              raw=Path(row['path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==row['file_sha256']
              assert json.loads(raw)['record_sha256']==row['record_sha256']
          print({'retained_files_checked':len(evidence),
                 'fresh_github_server_verification_performed':False})
          PY
      - name: Freshly replay both cohorts through GitHub's native run and contents APIs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python sports_fbs_feature_publication.py --replay benchmarks/fbs_pregame_reference_features_v1/publication_v1/first_cohort.json > /tmp/fbs-first-publication-replay.json
          python sports_fbs_feature_publication.py --replay benchmarks/fbs_pregame_reference_features_v1/publication_v1/second_cohort.json > /tmp/fbs-second-publication-replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: fbs-feature-publication-native-api-replay
          path: /tmp/fbs-*-publication-replay.json
          if-no-files-found: error
