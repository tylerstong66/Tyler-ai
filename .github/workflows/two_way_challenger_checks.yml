name: NHL and MLB challenger development
on:
  push:
    paths: ['sports_two_way_challenger.py', 'test_sports_two_way_challenger.py', 'sports_two_way_test.py', 'sports_historical_benchmark.py', 'sports_benchmark_review.py', 'benchmarks/two_way_challenger_v1/**', '.github/workflows/two_way_challenger_checks.yml']
  pull_request:
    paths: ['sports_two_way_challenger.py', 'test_sports_two_way_challenger.py', 'sports_two_way_test.py', 'sports_historical_benchmark.py', 'sports_benchmark_review.py', 'benchmarks/two_way_challenger_v1/**', '.github/workflows/two_way_challenger_checks.yml']
permissions:
  contents: read
jobs:
  offline-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check split isolation, delayed features, optimizer and frozen inputs
        run: python -m unittest -v test_sports_two_way_challenger
      - name: Reproduce development reports without network or credentials
        run: |
          python sports_two_way_challenger.py --output /tmp/two-way-challenger
          cmp benchmarks/two_way_challenger_v1/nhl_report.json /tmp/two-way-challenger/nhl_report.json
          cmp benchmarks/two_way_challenger_v1/mlb_report.json /tmp/two-way-challenger/mlb_report.json
          cmp benchmarks/two_way_challenger_v1/README.md /tmp/two-way-challenger/README.md
