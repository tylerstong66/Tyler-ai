name: Dinner AI EAS Status

on:
  push:
    branches:
      - dinner-ai-app
    paths:
      - Dinner-AI/.eas-status-trigger

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-AI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm install --global eas-cli
      - name: Inspect next EAS upload archive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          rm -rf /tmp/dinner-ai-eas-archive
          eas build:inspect --platform android --stage archive --profile preview --output /tmp/dinner-ai-eas-archive --force
          test -f /tmp/dinner-ai-eas-archive/src/lib/recommendations.ts
          echo "Verified: src/lib/recommendations.ts is present in the EAS archive."

      - name: Show recent Android builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:list --platform android --limit 5 --json --non-interactive

      - name: Inspect failed stable-signing build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:view 7d2b8ff1-628a-4fb0-be23-df17670e7ba1 --json

      - name: Download failed EAS log
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:view 7d2b8ff1-628a-4fb0-be23-df17670e7ba1 --json > /tmp/eas-build.json
          LOG_URL=$(node -e "const f=require('/tmp/eas-build.json'); console.log(f.logFiles?.[0] || '')")
          if [ -z "$LOG_URL" ]; then
            echo "No EAS log URL found."
            exit 1
          fi
          curl --compressed -fsSL "$LOG_URL" -o /tmp/eas-build.txt
          echo "Downloaded EAS log type:"
          file /tmp/eas-build.txt
          xxd -l 24 /tmp/eas-build.txt || true
          echo "===== EAS bundle failure lines ====="
          grep -nEi "error|failed|unable to resolve|module not found|syntax|referenceerror|typeerror|bundle javascript|metro" /tmp/eas-build.txt | tail -160 || true
          echo "===== Parsed EAS failure records ====="
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/eas-build.txt','utf8').split(/\r?\n/).filter(Boolean);
          for (const line of lines) {
            try {
              const row = JSON.parse(line);
              const phase = String(row.phase || '');
              const msg = String(row.msg || '');
              const failed = row.result === 'failure' || Number(row.level || 0) >= 40;
              const interesting = failed || /BUNDLE|JAVASCRIPT|METRO/i.test(phase) || /unable to resolve|module not found|syntaxerror|referenceerror|typeerror|error:/i.test(msg);
              if (interesting) console.log(JSON.stringify({time: row.time, phase, level: row.level, result: row.result, msg}));
            } catch {}
          }
          NODE
