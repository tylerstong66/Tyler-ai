name: Dinner AI EAS Status

on:
  push:
    branches:
      - dinner-ai-app
    paths:
      - Dinner-AI/.eas-status-trigger

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-AI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm install --global eas-cli
      - name: Show recent Android builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:list --platform android --limit 5 --json --non-interactive

      - name: Inspect failed stable-signing build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build:view bd0a41ac-96ab-46dd-bd1a-5cd8a18e81a1 --json

      - name: Download failed EAS log
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:view bd0a41ac-96ab-46dd-bd1a-5cd8a18e81a1 --json > /tmp/eas-build.json
          LOG_URL=$(node -e "const f=require('/tmp/eas-build.json'); console.log(f.logFiles?.[0] || '')")
          if [ -z "$LOG_URL" ]; then
            echo "No EAS log URL found."
            exit 1
          fi
          curl --compressed -fsSL "$LOG_URL" -o /tmp/eas-build.txt
          echo "Downloaded EAS log type:"
          file /tmp/eas-build.txt
          xxd -l 24 /tmp/eas-build.txt || true
          echo "===== EAS bundle failure lines ====="
          grep -nEi "error|failed|unable to resolve|module not found|syntax|referenceerror|typeerror|bundle javascript|metro" /tmp/eas-build.txt | tail -160 || true
          echo "===== Raw EAS log tail ====="
          tail -220 /tmp/eas-build.txt
