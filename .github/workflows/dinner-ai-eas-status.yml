name: Dinner AI EAS Status

on:
  workflow_dispatch:
  push:
    branches:
      - dinner-ai-app
    paths:
      - Dinner-AI/.eas-status-trigger

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-AI
    steps:
      - name: Check out Dinner AI
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Dinner-AI/package.json

      - name: Install dependencies
        run: npm install

      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Verify and download stable-signed v0.9.4
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: 2b10edb4-9b0d-4b97-8afa-1acb0076b727
        run: |
          eas build:view "$EAS_BUILD_ID" --json > /tmp/eas-build.json
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const build = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          if (build.status !== 'FINISHED') {
            throw new Error(`Expected a finished EAS build, received ${build.status}`);
          }
          const url = build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl;
          if (!url) throw new Error('The finished EAS build did not include an APK URL.');
          execFileSync('curl', [
            '--fail', '--location', '--silent', '--show-error',
            '--retry', '3', '--output', '/tmp/Dinner-AI-v0.9.4-Stable.apk', url,
          ], { stdio: 'inherit' });
          const size = fs.statSync('/tmp/Dinner-AI-v0.9.4-Stable.apk').size;
          if (size < 10_000_000) throw new Error(`Downloaded APK is unexpectedly small: ${size} bytes`);
          console.log(`Verified stable APK: ${size} bytes`);
          NODE

      - name: Upload stable Dinner AI APK
        uses: actions/upload-artifact@v6
        with:
          name: Dinner-AI-v0.9.4-Stable
          path: /tmp/Dinner-AI-v0.9.4-Stable.apk
          if-no-files-found: error
          retention-days: 30
