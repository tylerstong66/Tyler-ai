name: Archived college final receipt checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'sports_expansion_historical_capture.py'
      - 'test_sports_expansion_historical_capture.py'
      - 'sports_expansion_audit.py'
      - 'test_sports_expansion_audit.py'
      - 'sports_college*.py'
      - 'sports_ncaa*.py'
      - 'sports_nba*.py'
      - 'test_sports_nba*.py'
      - 'test_sports_college*.py'
      - 'test_sports_ncaa*.py'
      - '.github/workflows/college_final_receipts.yml'
      - '.github/workflows/college_nba_source_observation.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Test final receipt replay and research isolation
        run: python -m unittest -v test_sports_college_final_receipts test_sports_college_dual_source_finals test_sports_ncaa_espn_crosswalk_receipts test_sports_college_nba_chronology test_sports_college_nba_eligibility test_sports_college_result_dataset test_sports_nba_final_receipts test_sports_nba_schedule_receipts test_sports_nba_official_schedule_audit test_sports_college_d1_receipts test_sports_expansion_audit test_sports_expansion_historical_capture
      - name: Replay retained final evidence without collecting network data
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import sports_ncaa_espn_identity as identity
          from sports_college_final_receipts import build
          files = sorted((identity.ROOT / 'captures').glob('*/manifest.json'))
          if not files:
              raise ValueError('Missing archived college crosswalk')
          report = build(Path('.'), files[-1].parent.name)
          assert report['NO_BET'] and report['actual_wagers'] == 0
          assert not report['historical_evaluation_enabled']
          print({'agreements': report['two_source_final_agreements'],
                 'pending': report['pending_or_quarantined']})
          PYCODE
      - name: Assemble all retained crosswalk observations without duplicate games
        run: python sports_college_result_dataset.py > college-result-dataset.json
      - uses: actions/upload-artifact@v4
        with:
          name: college-result-observation-dataset
          path: college-result-dataset.json
          retention-days: 30
      - name: Replay NBA finals or expose missing independent source
        run: python sports_nba_final_receipts.py > nba-final-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-final-research-status
          path: nba-final-research.json
          retention-days: 30
