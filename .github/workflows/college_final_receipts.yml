name: Archived college final receipt checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - benchmarks/nba_pregame_features_v1/**
      - sports_historical_college_features.py
      - test_sports_historical_college_features.py
      - sports_historical_d1_school_identities.py
      - test_sports_historical_d1_school_identities.py
      - sports_historical_d1_identity_review.py
      - test_sports_historical_d1_identity_review.py
      - sports_historical_nba_features.py
      - test_sports_historical_nba_features.py
      - sports_historical_extension_seal.py
      - test_sports_historical_extension_seal.py
      - sports_historical_college_disputes.py
      - test_sports_historical_college_disputes.py
      - test_sports_ncaa_d1_source_quarantine.py
      - 'sports_ncaa_d1_historical_owned.py'
      - 'test_sports_ncaa_d1_historical_owned.py'
      - 'test_sports_historical_d1_crosscheck.py'
      - 'sports_ncaa_historical_owned.py'
      - 'test_sports_ncaa_historical_owned.py'
      - sports_historical_school_identities.py
      - test_sports_historical_school_identities.py
      - benchmarks/college_nba_history_v1/school_identity_v1/**
      - 'sports_historical_fbs_crosscheck.py'
      - 'test_sports_historical_fbs_crosscheck.py'
      - 'sports_historical_identity_audit.py'
      - 'sports_historical_content_seal.py'
      - 'test_sports_historical_content_seal.py'
      - 'test_sports_historical_identity_audit.py'
      - 'benchmarks/college_nba_history_v1/**'
      - sports_nba_historical_owned.py
      - sports_historical_nba_crosscheck.py
      - test_sports_nba_historical_owned.py
      - test_sports_historical_nba_crosscheck.py
      - sports_nba_final_receipts.py
      - sports_nba_official_schedule_audit.py
      - 'sports_expansion_historical_capture.py'
      - 'test_sports_expansion_historical_capture.py'
      - 'sports_expansion_audit.py'
      - 'test_sports_expansion_audit.py'
      - 'sports_college*.py'
      - 'sports_ncaa*.py'
      - 'sports_nba*.py'
      - 'test_sports_nba*.py'
      - 'test_sports_college*.py'
      - 'test_sports_ncaa*.py'
      - '.github/workflows/college_final_receipts.yml'
      - '.github/workflows/college_nba_source_observation.yml'
permissions:
  contents: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Test final receipt replay and research isolation
        run: python -m unittest -v test_sports_nba_feature_cohort test_sports_nba_feature_publication test_sports_nba_pregame_features test_sports_nba_schedule_slots test_sports_historical_college_features test_sports_historical_d1_school_identities test_sports_historical_d1_identity_review test_sports_historical_nba_features test_sports_historical_extension_seal test_sports_historical_college_disputes test_sports_college_final_receipts test_sports_college_dual_source_finals test_sports_ncaa_espn_crosswalk_receipts test_sports_college_nba_chronology test_sports_college_nba_eligibility test_sports_college_result_dataset test_sports_nba_final_receipts test_sports_nba_schedule_receipts test_sports_nba_official_schedule_audit test_sports_college_d1_receipts test_sports_expansion_audit test_sports_expansion_historical_capture test_sports_historical_identity_audit test_sports_ncaa_historical_owned test_sports_historical_fbs_crosscheck test_sports_ncaa_d1_historical_owned test_sports_ncaa_d1_source_quarantine test_sports_historical_d1_crosscheck test_sports_historical_content_seal test_sports_nba_historical_owned test_sports_historical_nba_crosscheck test_sports_historical_school_identities
      - name: Replay retained final evidence without collecting network data
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import sports_ncaa_espn_identity as identity
          from sports_college_final_receipts import build
          files = sorted((identity.ROOT / 'captures').glob('*/manifest.json'))
          if not files:
              raise ValueError('Missing archived college crosswalk')
          report = build(Path('.'), files[-1].parent.name)
          assert report['NO_BET'] and report['actual_wagers'] == 0
          assert not report['historical_evaluation_enabled']
          print({'agreements': report['two_source_final_agreements'],
                 'pending': report['pending_or_quarantined']})
          PYCODE
      - name: Assemble all retained crosswalk observations without duplicate games
        run: python sports_college_result_dataset.py > college-result-dataset.json
      - uses: actions/upload-artifact@v4
        with:
          name: college-result-observation-dataset
          path: college-result-dataset.json
          retention-days: 30
      - name: Replay NBA finals or expose missing independent source
        run: python sports_nba_final_receipts.py > nba-final-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-final-research-status
          path: nba-final-research.json
          retention-days: 30
      - name: Audit actual retained historical provider identities
        run: python sports_historical_identity_audit.py > historical-identity-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-provider-identity-audit
          path: historical-identity-audit.json
          retention-days: 30
      - name: Replay every retained independent NCAA historical week
        run: |
          python - <<'PYCODE'
          import sports_ncaa_historical_owned as owned
          for split in owned.YEARS:
              for week in owned.WEEKS:
                  owned.verify('.', split, week)
          PYCODE
      - name: Crosscheck original historical FBS finals under exact school identity
        run: python sports_historical_fbs_crosscheck.py > historical-fbs-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fbs-source-crosscheck
          path: historical-fbs-crosscheck.json
          retention-days: 30
      - name: Replay original D1 historical finals conservatively
        run: |
          python sports_historical_fbs_crosscheck.py --league NCAAM_D1 --split train > historical-d1-train-crosscheck.json
          python sports_historical_fbs_crosscheck.py --league NCAAM_D1 --split validation > historical-d1-validation-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-d1-source-crosscheck
          path: historical-d1-*-crosscheck.json
          retention-days: 30
      - name: Replay original NBA historical finals for both season splits
        run: |
          python sports_historical_nba_crosscheck.py --split train > historical-nba-train-crosscheck.json
          python sports_historical_nba_crosscheck.py --split validation > historical-nba-validation-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-nba-source-crosscheck
          path: historical-nba-*-crosscheck.json
          retention-days: 30
      - name: Replay separately reviewed historical FBS school identities
        run: |
          python sports_historical_fbs_crosscheck.py --verified-school-aliases --split train > historical-fbs-reviewed-train.json
          python sports_historical_fbs_crosscheck.py --verified-school-aliases --split validation > historical-fbs-reviewed-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fbs-reviewed-identities
          path: historical-fbs-reviewed-*.json
          retention-days: 30
      - name: Replay separate NBA exact-tipoff historical identity policy
        run: |
          python sports_historical_nba_crosscheck.py --exact-tipoff-identity --split train > historical-nba-exact-train.json
          python sports_historical_nba_crosscheck.py --exact-tipoff-identity --split validation > historical-nba-exact-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-nba-exact-tipoff-identities
          path: historical-nba-exact-*.json
          retention-days: 30
      - name: Verify completed independent-source byte index
        run: python sports_historical_extension_seal.py
      - name: Verify frozen original input bytes without certifying model eligibility
        run: python sports_historical_content_seal.py
      - name: Retain both sides of unresolved historical college score disputes
        run: |
          python - <<'PYCODE' > historical-college-score-disputes.json
          import json
          from sports_historical_college_disputes import build
          print(json.dumps([build(league=league,split=split)
                            for league in ('NCAAF_FBS','NCAAM_D1')
                            for split in ('train','validation')],sort_keys=True,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: historical-college-score-disputes
          path: historical-college-score-disputes.json
          retention-days: 30
      - name: Replay separate NBA source-backed feature diagnostics without fitting
        run: |
          python sports_historical_nba_features.py --split train > historical-nba-train-features.json
          python sports_historical_nba_features.py --split validation > historical-nba-validation-features.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-nba-source-backed-feature-diagnostics
          path: historical-nba-*-features.json
          retention-days: 30
      - name: Assemble D1 institutional-identity review evidence without enabling aliases
        run: python sports_historical_d1_identity_review.py > historical-d1-identity-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-d1-institutional-identity-review
          path: historical-d1-identity-review.json
          retention-days: 30
      - name: Replay separately reviewed D1 spelling policy and unresolved score claims
        run: |
          python sports_historical_fbs_crosscheck.py --league NCAAM_D1 --verified-school-aliases --split train > historical-d1-reviewed-train.json
          python sports_historical_fbs_crosscheck.py --league NCAAM_D1 --verified-school-aliases --split validation > historical-d1-reviewed-validation.json
          python sports_historical_college_disputes.py --verified-school-aliases --split train > historical-d1-reviewed-disputes-train.json
          python sports_historical_college_disputes.py --verified-school-aliases --split validation > historical-d1-reviewed-disputes-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-d1-reviewed-spellings-and-score-disputes
          path: historical-d1-reviewed-*.json
          retention-days: 30
      - name: Replay separate FBS and D1 source-backed feature diagnostics without fitting
        run: |
          python sports_historical_college_features.py --league NCAAF_FBS --split train > historical-fbs-train-features.json
          python sports_historical_college_features.py --league NCAAF_FBS --split validation > historical-fbs-validation-features.json
          python sports_historical_college_features.py --league NCAAM_D1 --split train > historical-d1-train-features.json
          python sports_historical_college_features.py --league NCAAM_D1 --split validation > historical-d1-validation-features.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-college-source-backed-feature-diagnostics
          path: |
            historical-fbs-*-features.json
            historical-d1-*-features.json
          retention-days: 30
      - name: Audit frozen NBA pregame feature observations without creating new records
        run: python sports_nba_pregame_features.py --audit-only > nba-pregame-feature-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-pregame-feature-observation-audit
          path: nba-pregame-feature-audit.json
          retention-days: 30
      - name: Inspect frozen NBA feature cohort without prediction grading
        run: python sports_nba_feature_cohort.py > nba-feature-cohort.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-frozen-feature-cohort-lifecycle
          path: nba-feature-cohort.json
          retention-days: 30
