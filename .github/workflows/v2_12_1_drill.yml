name: Tyler AI v2.12.1 safe drill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  safe-drill-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run v2.12.1 safe incident drill tests
        run: python -m unittest -v test_safe_incident_drill.py

      - name: Smoke-test v2.12.1 integration
        run: |
          python - <<'PY'
          import app_v2_12_1
          assert app_v2_12_1.VERSION_SHORT == 'v2.12.1'
          assert app_v2_12_1.app is not None
          assert app_v2_12_1.base.handle_message is app_v2_12_1.handle_message_v2121
          assert app_v2_12_1.safe_drill_request('Run proactive operations test')
          assert not app_v2_12_1.safe_drill_request('Show proactive operations')
          with app_v2_12_1.app.test_client() as client:
              health = client.get('/health')
              assert health.status_code == 200
              assert health.get_json()['version_short'] == 'v2.12.1'
          print('v2.12.1 integration import passed')
          PY
