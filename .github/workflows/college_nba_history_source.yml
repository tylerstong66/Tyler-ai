name: NBA and college season-split historical source research
on:
  push:
    branches: ['main']
    paths:
      - sports_expansion_historical_capture.py
      - test_sports_expansion_historical_capture.py
      - .github/workflows/college_nba_history_source.yml
  schedule:
    - cron: '40 5,13,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: college-nba-historical-data-v1
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned network transport
        run: python -m pip install requests==2.32.5
      - name: Test prospective isolation, chronology and sealed history
        run: python -m unittest -v test_sports_expansion_historical_capture
      - name: Fetch bounded 2024 training / 2025 validation season history
        run: python sports_expansion_historical_capture.py
      - name: Publish historical SOURCE receipts only after entire batch succeeds
        run: |
          git add benchmarks/college_nba_history_v1
          if ! git diff --cached --quiet; then
            git config user.name github-actions\[bot\]
            git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
            git commit -m "Archive NBA FBS D1 source receipts [research only]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
