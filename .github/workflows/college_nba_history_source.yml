name: NBA and college season-split historical source research
on:
  push:
    branches: ['main']
    paths:
      - sports_nba_historical_owned.py
      - sports_historical_nba_crosscheck.py
      - test_sports_nba_historical_owned.py
      - test_sports_historical_nba_crosscheck.py
      - sports_nba_final_receipts.py
      - sports_nba_official_schedule_audit.py
      - sports_expansion_historical_capture.py
      - sports_historical_identity_audit.py
      - sports_historical_extension_seal.py
      - test_sports_historical_extension_seal.py
      - benchmarks/college_nba_history_v1/INDEPENDENT_SOURCE_COMPLETION_2026_10_19.json
      - sports_historical_content_seal.py
      - test_sports_historical_content_seal.py
      - sports_historical_school_identities.py
      - test_sports_historical_school_identities.py
      - benchmarks/college_nba_history_v1/school_identity_v1/**
      - sports_historical_fbs_crosscheck.py
      - test_sports_historical_fbs_crosscheck.py
      - sports_ncaa_espn_identity.py
      - sports_college_dual_source_finals.py
      - sports_ncaa_historical_owned.py
      - test_sports_ncaa_d1_source_quarantine.py
      - sports_ncaa_official_source.py
      - sports_ncaa_d1_historical_owned.py
      - test_sports_ncaa_d1_historical_owned.py
      - test_sports_historical_d1_crosscheck.py
      - test_sports_ncaa_historical_owned.py
      - test_sports_historical_identity_audit.py
      - sports_expansion_audit.py
      - test_sports_expansion_audit.py
      - test_sports_expansion_historical_capture.py
      - .github/workflows/college_nba_history_source.yml
  schedule:
    - cron: '40 5,13,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: college-nba-historical-data-v1
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned network transport
        run: python -m pip install requests==2.32.5
      - name: Test prospective isolation, chronology and sealed history
        run: python -m unittest -v test_sports_historical_extension_seal test_sports_expansion_historical_capture test_sports_historical_identity_audit test_sports_ncaa_historical_owned test_sports_historical_fbs_crosscheck test_sports_ncaa_d1_historical_owned test_sports_ncaa_d1_source_quarantine test_sports_historical_d1_crosscheck test_sports_historical_content_seal test_sports_nba_historical_owned test_sports_historical_nba_crosscheck test_sports_historical_school_identities
      - name: Verify the frozen original source-content index before acquisition
        run: python sports_historical_content_seal.py
      - name: Verify completed independent-source archive before acquisition
        run: python sports_historical_extension_seal.py
      - name: Fetch bounded 2024 training / 2025 validation season history
        run: python sports_expansion_historical_capture.py
      - name: Retain bounded NCAA-owned historical FBS source weeks
        id: ncaa_owned
        continue-on-error: true
        run: python sports_ncaa_historical_owned.py
      - name: Retain bounded NCAA-owned historical D1 men's source days
        id: d1_owned
        continue-on-error: true
        run: python sports_ncaa_d1_historical_owned.py
      - name: Retain original NBA-owned closed-season source
        id: nba_owned
        continue-on-error: true
        run: python sports_nba_historical_owned.py
      - name: Audit archived provider identities, split separation and game dates
        run: python sports_historical_identity_audit.py > historical-identity-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-provider-identity-audit
          path: historical-identity-audit.json
          retention-days: 30
      - name: Crosscheck historical independent NCAA and ESPN finals
        run: python sports_historical_fbs_crosscheck.py > historical-fbs-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fbs-source-crosscheck
          path: historical-fbs-crosscheck.json
          retention-days: 30
      - name: Crosscheck retained D1 historical original source finals
        run: |
          python sports_historical_fbs_crosscheck.py --league NCAAM_D1 --split train > historical-d1-train-crosscheck.json
          python sports_historical_fbs_crosscheck.py --league NCAAM_D1 --split validation > historical-d1-validation-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-d1-source-crosscheck
          path: historical-d1-*-crosscheck.json
          retention-days: 30
      - name: Replay original NBA historical finals for both season splits
        run: |
          python sports_historical_nba_crosscheck.py --split train > historical-nba-train-crosscheck.json
          python sports_historical_nba_crosscheck.py --split validation > historical-nba-validation-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-nba-source-crosscheck
          path: historical-nba-*-crosscheck.json
          retention-days: 30
      - name: Replay separately reviewed historical FBS school identities
        run: |
          python sports_historical_fbs_crosscheck.py --verified-school-aliases --split train > historical-fbs-reviewed-train.json
          python sports_historical_fbs_crosscheck.py --verified-school-aliases --split validation > historical-fbs-reviewed-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-fbs-reviewed-identities
          path: historical-fbs-reviewed-*.json
          retention-days: 30
      - name: Replay separate NBA exact-tipoff historical identity policy
        run: |
          python sports_historical_nba_crosscheck.py --exact-tipoff-identity --split train > historical-nba-exact-train.json
          python sports_historical_nba_crosscheck.py --exact-tipoff-identity --split validation > historical-nba-exact-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-nba-exact-tipoff-identities
          path: historical-nba-exact-*.json
          retention-days: 30
      - name: Publish historical SOURCE receipts only after entire batch succeeds
        run: |
          git add benchmarks/college_nba_history_v1/sources benchmarks/college_nba_history_v1/COVERAGE.latest.json
          if [ "${{ steps.ncaa_owned.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_history_v1/ncaa_owned/NCAAF_FBS
          else
            echo '::warning::Independent NCAA history unavailable; preserve provider observations separately'
          fi
          if [ "${{ steps.d1_owned.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_history_v1/ncaa_owned/NCAAM_D1
          else
            echo '::warning::Independent D1 source unavailable; do not certify D1 results'
          fi
          if [ "${{ steps.nba_owned.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_history_v1/nba_owned
          else
            echo '::warning::Independent NBA source unavailable; do not certify NBA results'
          fi
          if ! git diff --cached --quiet; then
            git config user.name github-actions\[bot\]
            git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
            git commit -m "Archive NBA FBS D1 source receipts [research only]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
