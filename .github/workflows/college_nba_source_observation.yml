name: College football, college hoops and NBA research evidence
on:
  push:
    branches: ['main']
    paths:
      - sports_fbs_pregame_features.py
      - test_sports_fbs_pregame_features.py
      - benchmarks/fbs_pregame_reference_features_v1/protocol.json
      - sports_nba_feature_cohort.py
      - test_sports_nba_feature_cohort.py
      - sports_nba_pregame_features.py
      - test_sports_nba_pregame_features.py
      - benchmarks/nba_pregame_features_v1/protocol.json
      - sports_nba_schedule_slots.py
      - test_sports_nba_schedule_slots.py
      - sports_expansion_observer.py
      - sports_expansion_audit.py
      - sports_nba_official_schedule_audit.py
      - sports_nba_final_receipts.py
      - test_sports_nba_final_receipts.py
      - sports_ncaa_official_source.py
      - sports_ncaa_espn_identity.py
      - test_sports_expansion_observer.py
      - test_sports_expansion_audit.py
      - test_sports_nba_official_schedule_audit.py
      - test_sports_ncaa_official_source.py
      - test_sports_ncaa_espn_identity.py
      - sports_college_nba_chronology.py
      - test_sports_college_nba_chronology.py
      - sports_college_nba_eligibility.py
      - test_sports_college_nba_eligibility.py
      - sports_college_nba_receipts.py
      - sports_nba_schedule_receipts.py
      - test_sports_nba_schedule_receipts.py
      - sports_ncaa_owned_receipts.py
      - test_sports_ncaa_owned_receipts.py
      - sports_ncaa_espn_crosswalk_receipts.py
      - test_sports_ncaa_espn_crosswalk_receipts.py
      - sports_college_dual_source_finals.py
      - sports_college_final_receipts.py
      - sports_college_result_dataset.py
      - test_sports_college_result_dataset.py
      - test_sports_college_d1_receipts.py
      - test_sports_college_final_receipts.py
      - test_sports_college_dual_source_finals.py
      - test_sports_college_nba_receipts.py
      - .github/workflows/college_nba_source_observation.yml
  workflow_dispatch:
  schedule:
    - cron: '10 5,13,21 * * *'
permissions:
  contents: write
concurrency:
  group: college-nba-paper-observer-v1
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned transport
        run: python -m pip install requests==2.32.5
      - name: Check game-source parser and forecast isolation
        run: python -m unittest -v test_sports_fbs_pregame_features test_sports_nba_feature_cohort test_sports_nba_pregame_features test_sports_nba_schedule_slots test_sports_expansion_observer test_sports_expansion_audit test_sports_nba_official_schedule_audit test_sports_ncaa_official_source test_sports_ncaa_espn_identity test_sports_college_nba_chronology test_sports_college_nba_eligibility test_sports_college_nba_receipts test_sports_nba_schedule_receipts test_sports_ncaa_owned_receipts test_sports_ncaa_espn_crosswalk_receipts test_sports_college_dual_source_finals test_sports_college_final_receipts test_sports_college_result_dataset test_sports_nba_final_receipts test_sports_college_d1_receipts
      - name: Retain timestamped source-only college and NBA snapshots
        id: observation
        run: python sports_expansion_observer.py --days-ahead 3
      - name: Verify every archived response SHA256 and replay game evidence
        id: audit
        run: python sports_expansion_audit.py
      - name: Compare NBA CDN schedule to archived ESPN season games
        id: nba_source
        continue-on-error: true
        run: python sports_nba_official_schedule_audit.py
      - name: Query NCAA-owned FBS and men's hoops scoreboard source (optional)
        id: ncaa_source
        continue-on-error: true
        run: python sports_ncaa_official_source.py
      - name: Reconcile strictly identical NCAA and ESPN college game identities
        id: college_identity
        if: steps.ncaa_source.outcome == 'success'
        continue-on-error: true
        run: python sports_ncaa_espn_identity.py
      - name: Replay archived college finals with postgame chronology gates
        id: college_finals
        if: steps.college_identity.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import sports_ncaa_espn_identity as identity
          from sports_college_final_receipts import publish
          files = sorted((identity.ROOT / 'captures').glob('*/manifest.json'))
          report = publish(Path('.'), files[-1].parent.name)
          print({'agreements': report['two_source_final_agreements'],
                 'pending': report['pending_or_quarantined'], 'NO_BET': True})
          PYCODE
      - name: Assemble result observations from all retained crosswalk receipts
        id: college_dataset
        if: steps.college_finals.outcome == 'success'
        continue-on-error: true
        run: python sports_college_result_dataset.py > college-result-dataset.json
      - name: Attach replayed college result observation dataset
        if: steps.college_dataset.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: college-result-observation-dataset
          path: college-result-dataset.json
          retention-days: 30
      - name: Replay archived NBA final evidence or report source unavailable
        id: nba_finals
        run: python sports_nba_final_receipts.py > nba-final-research.json
      - name: Attach NBA final evidence status
        if: steps.nba_finals.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nba-final-research-status
          path: nba-final-research.json
          retention-days: 30
      - name: Freeze source-backed NBA pregame feature observations without predictions
        id: nba_features
        if: steps.nba_source.outcome == 'success'
        continue-on-error: true
        run: python sports_nba_pregame_features.py > nba-pregame-feature-status.json
      - uses: actions/upload-artifact@v4
        if: steps.nba_features.outcome == 'success'
        with:
          name: nba-pregame-feature-collection-status
          path: nba-pregame-feature-status.json
          retention-days: 30
      - name: Freeze source-backed FBS prior-season reference features without predictions
        id: fbs_features
        if: steps.college_identity.outcome == 'success'
        continue-on-error: true
        run: python sports_fbs_pregame_features.py --collect > fbs-pregame-feature-status.json
      - uses: actions/upload-artifact@v4
        if: steps.fbs_features.outcome == 'success'
        with:
          name: fbs-pregame-reference-feature-status
          path: fbs-pregame-feature-status.json
          retention-days: 30
      - name: Inspect frozen NBA cohort even when fresh NBA acquisition failed
        id: nba_cohort
        if: steps.audit.outcome == 'success'
        continue-on-error: true
        run: python sports_nba_feature_cohort.py > nba-feature-cohort.json
      - uses: actions/upload-artifact@v4
        if: steps.nba_cohort.outcome == 'success'
        with:
          name: nba-frozen-feature-cohort-lifecycle
          path: nba-feature-cohort.json
          retention-days: 30
      - name: Report independent source verification outcomes
        if: always()
        env:
          ESPN_OBSERVATION: ${{ steps.observation.outcome }}
          ESPN_REPLAY_AUDIT: ${{ steps.audit.outcome }}
          NBA_SCHEDULE_SOURCE: ${{ steps.nba_source.outcome }}
          NCAA_OWNED_SOURCE: ${{ steps.ncaa_source.outcome }}
          NCAA_ESPN_CROSSWALK: ${{ steps.college_identity.outcome }}
          NCAA_FINAL_RECEIPTS: ${{ steps.college_finals.outcome }}
          NCAA_RESULT_DATASET: ${{ steps.college_dataset.outcome }}
          NBA_FINAL_REPLAY: ${{ steps.nba_finals.outcome }}
          NBA_FEATURE_OBSERVATIONS: ${{ steps.nba_features.outcome }}
          NBA_FEATURE_COHORT_AUDIT: ${{ steps.nba_cohort.outcome }}
          FBS_FEATURE_OBSERVATIONS: ${{ steps.fbs_features.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcomes = {name: os.environ[name] for name in (
              'ESPN_OBSERVATION', 'ESPN_REPLAY_AUDIT', 'NBA_SCHEDULE_SOURCE',
              'NCAA_OWNED_SOURCE', 'NCAA_ESPN_CROSSWALK', 'NCAA_FINAL_RECEIPTS', 'NCAA_RESULT_DATASET', 'NBA_FINAL_REPLAY', 'NBA_FEATURE_OBSERVATIONS', 'NBA_FEATURE_COHORT_AUDIT', 'FBS_FEATURE_OBSERVATIONS')}
          receipt = {
              'schema': 'tyler-independent-source-workflow-status-v2',
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'source_head_sha': os.environ['GITHUB_SHA'],
              'partial_source_availability': any(outcomes[name] != 'success' for name in (
                  'ESPN_OBSERVATION', 'ESPN_REPLAY_AUDIT', 'NBA_SCHEDULE_SOURCE', 'NCAA_OWNED_SOURCE')),
              'new_nba_feature_collection_succeeded': outcomes['NBA_FEATURE_OBSERVATIONS'] == 'success',
              'green_workflow_certifies_all_sources': False,
              'step_outcomes': outcomes,
              'independent_nba_schedule_checked': outcomes['NBA_SCHEDULE_SOURCE'] == 'success',
              'independent_ncaa_source_checked': outcomes['NCAA_OWNED_SOURCE'] == 'success',
              'college_identity_crosswalk_checked': outcomes['NCAA_ESPN_CROSSWALK'] == 'success',
              'independent_official_final_results_verified': False,
              'forecasting_enabled': False, 'NO_BET': True, 'actual_wagers': 0,
          }
          encoded = json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          Path('college_nba_workflow_status.json').write_text(encoded)
          durable = Path('benchmarks/college_nba_source_v1/WORKFLOW_STATUS.latest.json')
          durable.parent.mkdir(parents=True, exist_ok=True)
          durable.write_text(encoded)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Independent NCAA/NBA source checks\n\n')
              for name, value in outcomes.items():
                  summary.write(f'- {name}: **{value}**\n')
              summary.write('\nSource checks do not verify official final scores, enable forecasts, or authorize wagers.\n')
          PY
      - name: Attach source-verification status to workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: college-nba-independent-source-status
          path: college_nba_workflow_status.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish only fully validated research capture
        if: ${{ steps.observation.outcome == 'success' && steps.audit.outcome == 'success' }}
        run: |
          git add benchmarks/college_nba_source_v1/captures benchmarks/college_nba_source_v1/COVERAGE.latest.json benchmarks/college_nba_source_v1/WORKFLOW_STATUS.latest.json
          if [ "${{ steps.nba_source.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_source_v1/nba_official
          else
            echo '::warning::NBA official source unverified; still retain independent ESPN archive'
          fi
          if [ "${{ steps.nba_features.outcome }}" = "success" ]; then
            git add benchmarks/nba_pregame_features_v1/records
          else
            echo '::warning::NBA feature observation step did not succeed; do not publish new feature files'
          fi
          if [ "${{ steps.fbs_features.outcome }}" = "success" ]; then
            git add benchmarks/fbs_pregame_reference_features_v1/records
          else
            echo '::warning::FBS reference-feature collection did not succeed; do not publish new feature files'
          fi
          if [ "${{ steps.ncaa_source.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_source_v1/ncaa_official
          else
            echo '::warning::NCAA-owned source unavailable; do not claim independent college final verification'
          fi
          if [ "${{ steps.college_identity.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_source_v1/college_identity
          else
            echo '::warning::No validated NCAA/ESPN identity crosswalk; retain original source evidence separately'
          fi
          if [ "${{ steps.college_finals.outcome }}" = "success" ]; then
            git add benchmarks/college_nba_source_v1/college_final_research
          fi
          if ! git diff --cached --quiet; then
            git config user.name github-actions\[bot\]
            git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
            git commit -m 'Record validated source evidence and availability status [no bets]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
