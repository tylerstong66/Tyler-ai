name: Tyler AI v2.18.2 Skill Lab transport

on:
  push:
    branches: [main]
    paths:
      - 'app_v2_18_2.py'
      - 'test_v2_18_2_transport.py'
      - '.github/workflows/v2_18_2_skill_lab_transport.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app_v2_18_2.py'
      - 'test_v2_18_2_transport.py'
      - '.github/workflows/v2_18_2_skill_lab_transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-lab-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run v2.18.2 provider-safe transport tests
        run: python -m unittest -v test_v2_18_2_transport.py
      - name: Re-run v2.18.1 budget suite in isolated process
        run: python -m unittest -v test_v2_18_1_budget.py
      - name: Re-run v2.18 Skill Lab suite in isolated process
        run: python -m unittest -v test_v2_18_skill_lab.py
      - name: Import and safety smoke test
        run: |
          python - <<'PY'
          import app_v2_18_2 as app
          assert app.VERSION_SHORT == 'v2.18.2'
          assert app.app is not None
          assert app.BENCHMARK_OUTPUT_BUDGET == 850
          assert app.BENCHMARK_TRANSPORT == 'plain_tagged_v1'
          assert app.SKILL_LAB.status()['automatic_skill_promotion_enabled'] is False
          assert 'app_v2_18_2.py' in app.EXECUTOR.safe_source_files_fn()
          print(app.VERSION_SHORT)
          PY
