name: Tyler AI read-only Render smoke check
on:
  push:
    branches: ['ops/tyler-render-smoke-20261015']
    paths:
      - ops_tyler_render_smoke.py
      - .github/workflows/tyler_render_smoke_20261015.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - run: python ops_tyler_render_smoke.py
        env:
          EXPECTED_VERSION: '2.19.3.39'
