name: InDinecision EAS build status

on:
  push:
    branches: [dinner-ai-app]
    paths:
      - .github/workflows/indinecision-eas-status.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-AI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Dinner-AI/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install EAS CLI
        run: npm install --global eas-cli
      - name: Verify project and report recent Android builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas project:info
          eas build:list --platform android --limit 5 --non-interactive
