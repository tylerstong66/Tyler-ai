name: Inspect Dinner AI EAS Build

on:
  push:
    branches:
      - dinner-ai-app
    paths:
      - Dinner-AI/.inspect-build-trigger

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-AI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Dinner-AI/package.json
      - run: npm install
      - run: npm install --global eas-cli
      - name: Link existing Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --id 0cbf5170-095b-4c59-8ac7-2e15667ed41c --non-interactive --force
      - name: Inspect EAS binary log container
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          eas build:view 85b8b074-250e-4c8d-82a4-99c42aa4aa16 --json > /tmp/build.json
          LOG_URL=$(node -e "const fs=require('fs');const t=fs.readFileSync('/tmp/build.json','utf8');const i=t.indexOf('{');const j=JSON.parse(t.slice(i));process.stdout.write(j.logFiles?.[0]||'')")
          curl -L --fail "$LOG_URL" -o /tmp/eas-build.bin
          echo "===== FILE TYPE ====="
          file /tmp/eas-build.bin || true
          echo "===== FIRST 64 BYTES ====="
          xxd -l 64 /tmp/eas-build.bin || true
          echo "===== PRINTABLE ERROR STRINGS ====="
          strings -n 4 /tmp/eas-build.bin | grep -i -E "bundle|metro|resolve|syntax|reference|typeerror|transform|error|module|router|src/|app/" | tail -n 500 || true
          echo "===== LAST PRINTABLE STRINGS ====="
          strings -n 4 /tmp/eas-build.bin | tail -n 500 || true
