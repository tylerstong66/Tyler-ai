name: Inspect Dinner AI EAS Build

on:
  push:
    branches:
      - dinner-ai-app
    paths:
      - Dinner-AI/.inspect-build-trigger

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dinner-AI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Dinner-AI/package.json
      - run: npm install
      - run: npm install --global eas-cli
      - name: Link existing Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --id 0cbf5170-095b-4c59-8ac7-2e15667ed41c --non-interactive --force
      - name: Fetch and decode failed EAS build logs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          eas build:view 85b8b074-250e-4c8d-82a4-99c42aa4aa16 --json > /tmp/build.json
          LOG_URL=$(node -e "const fs=require('fs');const t=fs.readFileSync('/tmp/build.json','utf8');const i=t.indexOf('{');const j=JSON.parse(t.slice(i));process.stdout.write(j.logFiles?.[0]||'')")
          curl -L --fail "$LOG_URL" -o /tmp/eas-build.bin
          python - <<'PY'
          import gzip, pathlib
          p = pathlib.Path('/tmp/eas-build.bin')
          b = p.read_bytes()
          try:
              t = gzip.decompress(b).decode('utf-8', errors='replace')
          except Exception:
              t = b.decode('utf-8', errors='replace')
          pathlib.Path('/tmp/eas-build.log').write_text(t, encoding='utf-8')
          print('decoded bytes:', len(b), 'decoded chars:', len(t))
          PY
          echo "===== ERROR LINES ====="
          grep -n -C 15 -E "Bundle JavaScript|Metro|Unable to resolve|SyntaxError|ReferenceError|TypeError|TransformError|error:|ERROR|Error:" /tmp/eas-build.log | tail -n 500 || true
          echo "===== FINAL 300 LINES ====="
          tail -n 300 /tmp/eas-build.log
