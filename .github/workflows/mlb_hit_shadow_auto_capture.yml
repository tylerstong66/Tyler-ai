name: MLB hitter shadow pregame collection
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mlb_hit_shadow_auto_capture.yml']
permissions:
  contents: write
concurrency:
  group: mlb-hitter-shadow-pregame-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_sports_mlb_prop_batch_capture
      - run: python sports_mlb_prop_batch_capture.py --per-side 3
      - name: Commit immutable, early forecasts
        run: |
          if [ ! -d benchmarks/mlb_hitter_props_shadow_v1/predictions ]; then exit 0; fi
          git add -A benchmarks/mlb_hitter_props_shadow_v1/predictions/
          if git diff --cached --quiet; then exit 0; fi
          python - <<'PY'
          import subprocess
          from sports_mlb_prop_batch_capture import ensure_publishable_before_events
          p=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          prefix='benchmarks/mlb_hitter_props_shadow_v1/predictions/'
          assert p and all(s.startswith(prefix) and s.endswith('.json') for s in p)
          ensure_publishable_before_events([{'path':s} for s in p],safety_seconds=180)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze MLB hitter shadow pregame data [no bets]"
          git push origin HEAD:main
