name: MLB live pregame end-to-end audit
on:
  push:
    branches:
      - audit/mlb-pregame-20261015-live
    paths:
      - audit_mlb_pregame_live.py
      - .github/workflows/mlb_pregame_live_audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python audit_mlb_pregame_live.py
