name: NBA separate recent postgame source observation
on:
  pull_request:
    paths:
      - sports_nba_postgame_observation.py
      - test_sports_nba_postgame_observation.py
      - sports_nba_final_games_page.py
      - sports_nba_games_page.py
      - sports_nba_owned_daily_observation.py
      - sports_expansion_audit.py
      - benchmarks/nba_postgame_daily_v1/**
      - .github/workflows/nba_postgame_observation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python -m unittest -v test_sports_nba_postgame_observation test_sports_nba_final_games_page test_sports_nba_games_page
      - name: Replay retained separate postgame source observations
        run: python sports_nba_postgame_observation.py --audit
      - name: Capture previous Eastern date at actual source receipt clock without grading
        run: python sports_nba_postgame_observation.py --collect --days-back 1 > nba-postgame-observation.json
      - name: Replay exact new original body and receipt
        run: python sports_nba_postgame_observation.py --audit > nba-postgame-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-separate-postgame-source-observation
          path: |
            benchmarks/nba_postgame_daily_v1/captures/
            nba-postgame-observation.json
            nba-postgame-replay.json
          if-no-files-found: error
          retention-days: 30
