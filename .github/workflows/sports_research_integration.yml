name: Integrated sports research regression checks
on:
  pull_request:
    paths:
      - 'sports_*.py'
      - 'test_sports*.py'
      - 'benchmarks/**'
      - '.github/workflows/sports_research_integration.yml'
  push:
    branches: [main]
    paths:
      - 'sports_*.py'
      - 'test_sports*.py'
      - 'benchmarks/**'
      - '.github/workflows/sports_research_integration.yml'
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run the integrated sports test suite without collecting data
        run: python -m unittest discover -v -p 'test_sports*.py'
      - name: Replay saved readiness, source receipts and frozen-feature lifecycles without collection
        run: |
          python sports_accuracy_readiness.py --json > accuracy-readiness-verification.json
          python sports_mlb_prop_shadow_scoreboard.py
          python sports_mlb_cross_cohort_audit.py > mlb-independent-cohort-evidence-verification.json
          python sports_nba_postgame_observation.py --audit
          python sports_nba_owned_daily_observation_v2.py --audit
          python sports_nba_native_pregame_features.py --audit > nba-native-pregame-feature-replay.json
          python sports_nba_postgame_observation_v2.py --audit
          python sports_nba_postgame_observation_v3.py --audit
          python sports_nba_final_games_page_v3.py --capture 20261021T100537057931Z > nba-native-final-break-status-diagnostic.json
          python sports_nba_v3_feature_diagnostic.py --capture 20261021T100537057931Z --provider-capture 20261021T100530748795Z > nba-v3-frozen-feature-source-diagnostic.json
          python sports_nba_native_feature_cohort.py > nba-native-feature-cohort-verification.json
          python sports_nba_v3_feature_cohort.py > nba-v3-frozen-feature-source-audit.json
          python sports_nba_native_v2_final_v3_cohort.py > nba-native-v2-v3-feature-lifecycle.json
          python sports_nba_receipt_coverage.py --json > nba-native-receipt-coverage-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('nba-native-feature-cohort-verification.json').read_text())
          keys = ('schema', 'source_status', 'requested_daily_source_date', 'native_page_status',
                  'frozen_feature_observations', 'frozen_games_outside_daily_source_date',
                  'corroborated_result_observations', 'pending_feature_observations',
                  'outcomes_enrolled', 'prediction_accuracy_computed', 'source_scope_complete',
                  'official_final_results_verified', 'forecasting_enabled',
                  'model_training_enabled', 'promotion_allowed', 'NO_BET', 'actual_wagers')
          print('NBA_NATIVE_FROZEN_FEATURE_AUDIT='+json.dumps(
              {key: report.get(key) for key in keys}, sort_keys=True, allow_nan=False))
          PY
      - name: Require unchanged tracked research evidence
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-sports-readiness-replay
          path: |
            accuracy-readiness-verification.json
            nba-native-feature-cohort-verification.json
            nba-native-receipt-coverage-verification.json
            mlb-independent-cohort-evidence-verification.json
            nba-native-final-break-status-diagnostic.json
            nba-v3-frozen-feature-source-diagnostic.json
            nba-v3-frozen-feature-source-audit.json
            nba-native-v2-v3-feature-lifecycle.json
            nba-native-pregame-feature-replay.json
          if-no-files-found: error
          retention-days: 30
