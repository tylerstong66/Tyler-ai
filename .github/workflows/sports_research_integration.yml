name: Integrated sports research regression checks
on:
  pull_request:
    paths:
      - 'sports_*.py'
      - 'test_sports*.py'
      - '.github/workflows/sports_research_integration.yml'
  push:
    branches: [main]
    paths:
      - 'sports_*.py'
      - 'test_sports*.py'
      - '.github/workflows/sports_research_integration.yml'
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run the integrated sports test suite without collecting data
        run: python -m unittest discover -v -p 'test_sports*.py'
      - name: Require unchanged tracked research evidence
        run: git diff --exit-code
