name: MLB original cohort publication chronology checks
on:
  pull_request:
    branches: [main]
    paths:
      - sports_mlb_cohort_publication.py
      - test_sports_mlb_cohort_publication.py
      - sports_mlb_cross_cohort_audit.py
      - sports_nba_feature_publication.py
      - benchmarks/mlb_cohort_publication_v1/**
      - benchmarks/mlb_hitter_props_shadow_v1/predictions/**
      - benchmarks/two_way_prospective/mlb/predictions/**
      - .github/workflows/mlb_cohort_publication_checks.yml
  push:
    branches: [main]
    paths:
      - sports_mlb_cohort_publication.py
      - test_sports_mlb_cohort_publication.py
      - sports_mlb_cross_cohort_audit.py
      - sports_nba_feature_publication.py
      - benchmarks/mlb_cohort_publication_v1/**
      - benchmarks/mlb_hitter_props_shadow_v1/predictions/**
      - benchmarks/two_way_prospective/mlb/predictions/**
      - .github/workflows/mlb_cohort_publication_checks.yml
permissions:
  contents: read
jobs:
  chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Test exact blobs, independent clocks and fixed cohort replay offline
        run: python -m unittest -v test_sports_mlb_cohort_publication test_sports_mlb_cross_cohort_audit test_sports_nba_feature_publication
      - name: Check saved recipe files against retained originals without claiming fresh server verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import sports_mlb_cohort_publication as p
          saved=json.loads(Path('benchmarks/mlb_cohort_publication_v1/first_three_games.json').read_text())
          inputs=p._inputs(Path('.'))
          assert set(saved['assignments'])=={r['path'] for r in saved['records']}
          assert len(saved['records'])==len(saved['assignments'])
          for row in saved['records']:
              for key,value in inputs[row['path']].items():
                  assert row[key]==value,(row['path'],key)
          print({'retained_forecast_files_checked':len(saved['records']),
                 'fresh_github_server_verification_performed':False})
          PY
