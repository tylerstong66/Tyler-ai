name: Sports Betting Analyst v1 software checks
on:
  push:
    paths: ['sports_*.py', 'app_v2_19_3_*.py', 'test_sports_betting.py', 'test_v2_19_3_*sports*.py', '.github/workflows/sports_betting_v1.yml']
  pull_request:
    paths: ['sports_*.py', 'app_v2_19_3_*.py', 'test_sports_betting.py', 'test_v2_19_3_*sports*.py', '.github/workflows/sports_betting_v1.yml']
permissions:
  contents: read
jobs:
  software-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_sports_betting.py
      - run: python -m unittest -v test_v2_19_3_10_sports_integration.py
      - run: python -m unittest -v test_v2_19_3_11_sports_audit.py
      - run: python -m unittest -v test_v2_19_3_12_sports_grounding.py
      - run: python -m unittest -v test_v2_19_3_13_sports_candidate.py
      - run: python -m unittest -v test_v2_19_3_14_sports_flash.py
      - run: python -m unittest -v test_v2_19_3_15_sports_math.py
      - run: python -m unittest -v test_v2_19_3_16_sports_coverage.py
      - run: python -m unittest -v test_v2_19_3_17_sports_records.py
      - run: python -m unittest -v test_v2_19_3_18_sports_grading.py
      - run: python -m unittest -v test_v2_19_3_19_sports_diagnostics.py
      - run: python -m unittest -v test_v2_19_3_20_sports_mechanisms.py
      - run: python -m unittest -v test_v2_19_3_21_sports_record_scope.py
      - run: python -m unittest -v test_v2_19_3_22_sports_quote_grounding.py
      - run: python -m unittest -v test_v2_19_3_23_sports_input_isolation.py
      - run: python -m unittest -v test_v2_19_3_24_sports_uncertainty.py
      - run: python -m unittest -v test_v2_19_3_25_sports_task_mechanisms.py
      - run: python -m unittest -v test_v2_19_3_26_sports_uncertainty_scope.py
      - run: python -m unittest -v test_v2_19_3_27_sports_negation_scope.py
      - run: python -m unittest -v test_v2_19_3_28_sports_topic_equivalents.py
      - run: python -m unittest -v test_v2_19_3_29_sports_reporting_negation.py
      - run: python -m unittest -v test_v2_19_3_30_sports_bounded_revision.py
      - run: python -m unittest -v test_v2_19_3_3_gemini_training.py
      - run: python -m unittest -v test_v2_19_3_8_training_diagnostics.py
