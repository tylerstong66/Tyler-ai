name: Tyler AI v2.19.3 mutation outcome learning

on:
  push:
    branches: [main]
    paths:
      - 'app_v2_19_3.py'
      - 'test_v2_19_3_mutation_outcome_learning.py'
      - '.github/workflows/v2_19_3_mutation_outcome_learning.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app_v2_19_3.py'
      - 'test_v2_19_3_mutation_outcome_learning.py'
      - '.github/workflows/v2_19_3_mutation_outcome_learning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-outcome-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run v2.19.3 mutation outcome learning suite
        run: python -m unittest -v test_v2_19_3_mutation_outcome_learning.py
      - name: Re-run v2.19.2.3.1 parser repair suite in a fresh process
        run: |
          python - <<'PY'
          import unittest
          import app_v2_19_2_3_1
          import test_v2_19_2_3_mutation_transport
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_v2_19_2_3_mutation_transport)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Re-run v2.19.2.2 mutation novelty suite in a fresh process
        run: python -m unittest -v test_v2_19_2_2_mutation_novelty.py
      - name: Re-run v2.19.2 constrained mutation suite in a fresh process
        run: python -m unittest -v test_v2_19_2_constrained_mutation.py
      - name: Re-run v2.19.1 champion training suite in a fresh process
        run: python -m unittest -v test_v2_19_1_champion_training.py
      - name: Import and safety smoke test
        run: |
          python - <<'PY'
          import app_v2_19_3 as app
          assert app.VERSION_SHORT == 'v2.19.3'
          assert app.app is not None
          assert app.MAX_MUTATED_FIELDS == 1
          assert app.MAX_NOVELTY_OPTIONS == 3
          assert app.ITERATIVE_BENCHMARK_OUTPUT_BUDGET + app.ITERATIVE_CANDIDATE_OUTPUT_TOKENS <= 1000
          status = app.TRAINER.status()
          assert status['automatic_activation'] is False
          assert status['human_promotion_required'] is True
          assert app.MUTATION_OUTCOME_CATEGORY in app.base.SPECIAL_MEMORY_CATEGORIES
          assert 'app_v2_19_3.py' in app.EXECUTOR.safe_source_files_fn()
          print(app.VERSION_SHORT)
          PY
